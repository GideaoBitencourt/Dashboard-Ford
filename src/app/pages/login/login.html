<body>
        
    <main>

        <section class="secao-imagem">
            <img src="img/ford-mustang-azul.png" class="img-mustang-azul" alt="Imagem de um Ford Mustang da cor azul">
        </section>

        <section class="formulario-login">

            <section class="logo-ford-login">
                <img src="img/ford.png" alt="Logo da Ford">
            </section>

            <h1>Boas-vindas</h1>
            
            <form action="onsubmit">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Insira seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="pass">Senha</label>
                    <input type="password" id="pass" name="password" placeholder="Insira sua senha" required>
                </div>

                <div>
                    <p>Logar automaticamente</p>
                    <button class="login-automatico"></button>
                </div>

                <button type="submit" class="botao-login" >
                    Entrar
                </button>

            </form>

        </section>
    </main>
</body>
